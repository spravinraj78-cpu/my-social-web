<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ data.name }} - Social Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='profile.jpg') }}" alt="Profile Picture" class="profile-img">
        <h1>{{ data.name }}</h1>
        <p class="bio">{{ data.bio }}</p>

        <div class="links">
            <a href="{{ data.insta_url }}" target="_blank" class="btn instagram">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            
            <a href="{{ data.yt_url }}" target="_blank" class="btn youtube">
                <i class="fab fa-youtube"></i> YouTube
            </a>
        </div>
    </div>
</body>
</html>
